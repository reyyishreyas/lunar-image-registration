# C13 — equal-GSD staging on FINAL_CONFIG base (Restart Phase 1).
#
# Cooperative: equal_gsd=true self-calibrates the NAC working-set factor from
# the homography's ground-scale ratio (no fixed nac_fac guess) and restages
# the pair into data/processed_equal_gsd/ so the champion FINAL crops are
# untouched. Note: restaging may shift the crop window, so RMSE vs the fixed
# pair1_gt.csv is reported but the comparable metric is inliers/inlier_ratio.
experiment:
  id: C13
  pair: phase1
  description: "equal-GSD working-set staging (self-calibrated nac_fac) on FINAL base: SIFT + CLAHE 4.0 + BF 0.75 + USAC_MAGSAC"

preprocessing:
  enabled: true
  equal_gsd: true
  ohrc_img: data/PATCH-001/data/OHRC/ch2_ohr_ncp_20210405T1606536730_d_img_d18/data/calibrated/20210405/ch2_ohr_ncp_20210405T1606536730_d_img_d18.img
  ohrc_geometry: data/PATCH-001/data/OHRC/ch2_ohr_ncp_20210405T1606536730_d_img_d18/geometry/calibrated/20210405/ch2_ohr_ncp_20210405T1606536730_g_grd_d18.csv
  nac_img: data/PATCH-001/data/LRO_NAC/LC/M1469248775LC.IMG
  out_dir: data/processed_equal_gsd
  crop_px: 1024
  outputs:
    src: data/processed_equal_gsd/pair1_src.png
    ref: data/processed_equal_gsd/pair1_ref.png

inputs:
  src: data/processed_equal_gsd/pair1_src.png
  ref: data/processed_equal_gsd/pair1_ref.png

normalize:
  enabled: true
  method: clahe
  clip_limit: 4.0
  tile_grid: 8

detector:
  name: sift
  nfeatures: 10000
  contrast_threshold: 0.04
  edge_threshold: 10

matcher:
  name: bf_ratio
  ratio: 0.75

outlier_rejection:
  name: ransac
  method: usac_magsac
  ransac_thresh: 5.0

ground_truth: data/ground_truth/pair1_gt.csv

outputs:
  matches_figure: results/figures/pair1_matches_C13.png
  ablation_log: results/logs/ablation.csv