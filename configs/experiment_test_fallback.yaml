# TEST config — exercises the learned emergency matcher fallback end-to-end.
# Detector = SuperPoint (fills the learned cache), classical matcher = BF with a
# deliberately impossible ratio so it produces <8 matches, which SHOULD trigger
# the LoFTR fallback and still register the pair. Used for Phase 6 functional
# verification only; NOT part of the canonical ablation.
experiment:
  id: TEST_FALLBACK
  pair: phase1
  description: "fallback functional test: SuperPoint + crippled BF ratio 0.03 -> LoFTR rescue"

preprocessing:
  enabled: false

inputs:
  src: data/processed/pair1_src.png
  ref: data/processed/pair1_ref.png

normalize:
  enabled: true
  method: clahe
  clip_limit: 4.0
  tile_grid: 8

detector:
  name: superpoint

matcher:
  name: bf_ratio
  ratio: 0.03
  learned_fallback: true

outlier_rejection:
  name: ransac
  method: usac_magsac
  ransac_thresh: 5.0

ground_truth: data/ground_truth/pair1_gt.csv

outputs:
  matches_figure: results/figures/pair1_matches_TEST_FALLBACK.png
  ablation_log: results/logs/ablation_test_fallback.csv