# FINAL_CONFIG — best configuration from Phase 4 ablation (AI_EXECUTION_PLAN.md).
#
# Selected config: C10 = SIFT + CLAHE(4.0, 8x8) + BF ratio(0.75) + USAC_MAGSAC(5.0).
# RMSE 22.6172 px (best of C1-C12). Verified reproducible (two identical runs).
#
# Phase 4 measured findings:
#   - Grid-uniform match capping (C9, best grid 16x16) slightly RAISED RMSE (22.6386 vs
#     C3 22.6316) on this pair; recorded, not selected.
#   - cornerSubPix (C11, 22.6500) and phase_cross_correlation (C12, 22.6379) sub-pixel
#     refinement of inlier points did not lower RMSE below unrefined MAGSAC (C10 22.6172);
#     the ~22.6 px residual is dominated by the GT/georeferencing bias, not by sub-pixel
#     point localization. Recorded, not selected.
#   - USAC_MAGSAC (C10) improved RMSE over plain RANSAC (C3 22.6316) and IS selected.
experiment:
  id: FINAL
  pair: phase1
  description: "FINAL_CONFIG (Phase 4 best = C10): SIFT + CLAHE 4.0 + BF ratio + USAC_MAGSAC"

preprocessing:
  enabled: true
  ohrc_img: data/PATCH-001/data/OHRC/ch2_ohr_ncp_20210405T1606536730_d_img_d18/data/calibrated/20210405/ch2_ohr_ncp_20210405T1606536730_d_img_d18.img
  ohrc_geometry: data/PATCH-001/data/OHRC/ch2_ohr_ncp_20210405T1606536730_d_img_d18/geometry/calibrated/20210405/ch2_ohr_ncp_20210405T1606536730_g_grd_d18.csv
  nac_img: data/PATCH-001/data/LRO_NAC/LC/M1469248775LC.IMG
  out_dir: data/processed
  crop_px: 1024
  outputs:
    src: data/processed/pair1_src.png
    ref: data/processed/pair1_ref.png

inputs:
  src: data/processed/pair1_src.png
  ref: data/processed/pair1_ref.png

normalize:
  enabled: true
  method: clahe
  clip_limit: 4.0
  tile_grid: 8

detector:
  name: sift
  nfeatures: 10000
  contrast_threshold: 0.04
  edge_threshold: 10

matcher:
  name: bf_ratio
  ratio: 0.75

outlier_rejection:
  name: ransac
  method: usac_magsac
  ransac_thresh: 5.0

ground_truth: data/ground_truth/pair1_gt_v2.csv

outputs:
  matches_figure: results/figures/pair1_matches_FINAL.png
  ablation_log: results/logs/ablation.csv